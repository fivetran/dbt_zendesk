version: 1.10.0
pr_number: 290
is_breaking: true
schema_data_changes:
  entries:
  - models:
    - '`zendesk__ticket_field_history`'
    - '`zendesk__ticket_backlog`'
    - '`int_zendesk__field_history_pivot`'
    change_type: Changed column
    old: '`status_status`'
    new: '`status`'
    is_breaking: true
    notes: Fixes column naming conflicts when a custom field shares a title with a
      standard field. Also removes unintended `<field>_<custom_field_id>` columns.
      Only affects configurations with these conflicts.
bug_fixes:
- description: Fixes `zendesk__ticket_backlog` failing when a custom ticket field
    shares a title with a standard field (for example, `Status`). Standard fields
    now retain their names; custom fields can be tracked separately by adding their
    numeric IDs to `ticket_field_history_columns` (for example, `status_<field_id>`).
- description: Fixes failures when custom ticket field titles contain no Latin letters
    or numbers (for example, `購入段階`). These fields can be tracked regardless of
    title using their numeric IDs, with a leading underscore (for example, `_<field_id>`).
date: '2026-11-02'
