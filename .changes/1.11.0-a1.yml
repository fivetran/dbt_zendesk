is_breaking: false
schema_data_changes:
  entries:
  - models:
    - '`zendesk__sla_policies`'
    change_type: Changed field
    old: '`metric` values: `first_reply_time`, `next_reply_time`, `agent_work_time`, `requester_wait_time`'
    new: Adds `periodic_update_time`
    is_breaking: false
    notes: Adds one row per `periodic_update_time` SLA event in calendar and business
      hours. Each event starts when Zendesk applies the target and ends at the next
      public agent comment or solve. Only affects accounts with periodic update targets
      in their SLA policies.
under_the_hood:
- description: Adds `periodic_update_time` seed data for calendar and business hour
    targets, and includes the metric in the `sla_count_match` integrity test.
