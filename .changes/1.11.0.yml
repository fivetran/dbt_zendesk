version: 1.11.0
pr_number: 300
new_features:
- title: Breaking change
  description: Raises the minimum dbt version to 1.10.0.
- description: Adds `dbt_utils.unique_combination_of_columns` tests to staging and
    end models. If a test fails, please [open an issue](https://github.com/fivetran/dbt_zendesk/issues/new/choose).
bug_fixes:
- description: Fixes date/timestamp type mismatches in `int_zendesk__field_calendar_spine`
    and `int_zendesk__timezone_daylight` that dbt Fusion's `--static-analysis strict`
    flags. Results are unchanged.
- description: Fixes the `tags` field in `stg_zendesk__user_tag` and `stg_zendesk__organization_tag`
    on Redshift, which returned the literal string `tag` for every record instead
    of the tag value. This also corrects the `requester_tag`, `submitter_tag`, `assignee_tag`,
    and `requester_organization_tags` fields in `zendesk__ticket_enriched`.
under_the_hood:
- description: Updates yml column documentation to match model output.
date: '2026-11-18'
