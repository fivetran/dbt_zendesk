title: Zendesk SLA Attainment
notes: |
  SLA events, breaches, and attainment by policy and metric from
  `zendesk__sla_policies`, counting completed events only: the model flags
  an in-flight event as `is_active_sla` with its breach outcome still
  unknown. Requires the package's SLA models, which are on by default and
  off when `using_schedules` or `using_sla_policy` is false.

text: |
  Weekly points show attainment among completed SLA events. Weeks without
  completed events have no point. Breach times show their business or calendar basis.

variables:
  date_range:
    label: SLA applied between
    input: daterange

  metric:
    input: multiselect
    options:
      query: metrics

queries:
  metrics:
    dialect: duckdb
    sql: |
      select distinct metric
      from {{ ref('zendesk__sla_policies') }}
      order by 1

  kpis:
    dialect: duckdb
    sql: |
      select
        count(*) as sla_events,
        sum(case when is_sla_breach then 1 else 0 end) as breaches,
        (sum(case when is_sla_breach then 0.0 else 1.0 end)) / nullif(count(*), 0) as attainment_rate
      from {{ ref('zendesk__sla_policies') }}
      where not is_active_sla
        and {{ filter_date_range('sla_applied_at', date_range) }}
        and {{ filter('metric', metric) }}

  by_policy:
    dialect: duckdb
    sql: |
      select
        coalesce(sla_policy_name, 'Unknown policy') as sla_policy_name,
        count(*) as sla_events,
        sum(case when is_sla_breach then 1 else 0 end) as breaches,
        (sum(case when is_sla_breach then 0.0 else 1.0 end)) / nullif(count(*), 0) as attainment_rate
      from {{ ref('zendesk__sla_policies') }}
      where not is_active_sla
        and {{ filter_date_range('sla_applied_at', date_range) }}
        and {{ filter('metric', metric) }}
      group by 1
      order by breaches desc

  by_metric:
    dialect: duckdb
    sql: |
      select
        metric,
        count(*) as sla_events,
        sum(case when is_sla_breach then 1 else 0 end) as breaches,
        (sum(case when is_sla_breach then 0.0 else 1.0 end)) / nullif(count(*), 0) as attainment_rate
      from {{ ref('zendesk__sla_policies') }}
      where not is_active_sla
        and {{ filter_date_range('sla_applied_at', date_range) }}
        and {{ filter('metric', metric) }}
      group by 1
      order by breaches desc

  attainment_by_week:
    formats:
      attainment_rate: percent_whole
    dialect: duckdb
    sql: |
      select date_trunc('week', sla_applied_at) as week, metric,
        sum(case when is_sla_breach then 0.0 else 1.0 end) / nullif(count(*), 0) as attainment_rate
      from {{ ref('zendesk__sla_policies') }}
      where not is_active_sla
        and {{ filter_date_range('sla_applied_at', date_range) }}
        and {{ filter('metric', metric) }}
      group by 1, 2
      order by 1, 2

  recent_breaches:
    dialect: duckdb
    sql: |
      select
        ticket_id,
        coalesce(sla_policy_name, 'Unknown policy') as sla_policy_name,
        metric,
        case when in_business_hours then 'Business'
          when not in_business_hours then 'Calendar' else 'Unknown' end as hours_basis,
        target,
        sla_elapsed_time as elapsed_minutes,
        sla_applied_at,
        sla_breach_at
      from {{ ref('zendesk__sla_policies') }}
      where not is_active_sla and is_sla_breach
        and {{ filter_date_range('sla_applied_at', date_range) }}
        and {{ filter('metric', metric) }}
      order by sla_breach_at desc
      limit 100

charts:
  events_kpi:
    label: SLA Events
    query: kpis
    type: kpi
    value: sla_events
    style:
      value:
        format: integer

  breaches_kpi:
    label: Breaches
    query: kpis
    type: kpi
    value: breaches
    style:
      value:
        format: integer

  attainment_kpi:
    label: Attainment
    query: kpis
    type: kpi
    value: attainment_rate
    style:
      value:
        format: percent_whole

  policy_table:
    title: By Policy
    query: by_policy
    type: table
    style:
      columns:
        sla_policy_name:
          label: Policy
        sla_events:
          label: Events
          format: integer
          align: right
        breaches:
          format: integer
          align: right
        attainment_rate:
          label: Attainment (%)
          format: percent_whole
          align: right

  metric_chart:
    title: Breaches by Metric
    query: by_metric
    type: bar
    x: metric
    y: breaches

  weekly_chart:
    title: SLA Attainment per Week
    query: attainment_by_week
    type: scatter
    x: week
    y: attainment_rate
    y_label: Attainment (%)
    color: metric
    height: 240

  breaches_table:
    title: Recent Breaches
    query: recent_breaches
    type: table
    style:
      columns:
        ticket_id:
          label: Ticket
          format: id
        sla_policy_name:
          label: Policy
        target:
          label: Target (min)
          format: integer
          align: right
        elapsed_minutes:
          label: Elapsed (min)
          format: integer
          align: right

rows:
  - text: |
      [Overview](./overview) · [Backlog](./backlog) · [Agent performance](./agent-performance) · **SLA**
  - cols: [events_kpi, breaches_kpi, attainment_kpi]
  - cols: [policy_table, metric_chart]
  - weekly_chart
  - breaches_table
