title: Zendesk Agent Performance
notes: |
  Per-assignee workload, responsiveness, resolution, and CSAT from
  `zendesk__ticket_metrics`. Medians are exact and computed in plain SQL,
  so they match on every warehouse. Deleted tickets are excluded.
  Credit follows the current assignee; unassigned tickets are omitted.
  Zero-minute resolutions remain valid observations in the medians.

text: |
  Resolution rankings require at least five solved tickets per agent; CSAT
  rankings require five rated tickets. A ranking is empty when nobody qualifies.

variables:
  group:
    input: multiselect
    options:
      query: groups

  date_range:
    label: Created between
    input: daterange
    default: last_90_days

  assignee:
    input: multiselect
    options:
      query: assignees

queries:
  groups:
    dialect: duckdb
    sql: |
      select distinct group_name
      from {{ ref('zendesk__ticket_metrics') }}
      where group_name is not null and status is distinct from 'deleted' and not coalesce(_fivetran_deleted, false)
      order by 1

  assignees:
    dialect: duckdb
    sql: |
      select distinct assignee_name
      from {{ ref('zendesk__ticket_metrics') }}
      where status is distinct from 'deleted' and not coalesce(_fivetran_deleted, false)
          and assignee_name is not null
      order by 1

  # Exact medians: rank each value, then average the one or two middle rows.
  # Partitioning by `<col> is null` keeps nulls out of the 1..n ranking.
  agent_medians:
    dialect: duckdb
    sql: |
      select
        assignee_name,
        avg(case when reply_rn in (floor((reply_n + 1) / 2.0), ceil((reply_n + 1) / 2.0))
            then cast(first_reply_time_calendar_minutes as double) end) as median_first_reply_minutes,
        avg(case when resolution_rn in (floor((resolution_n + 1) / 2.0), ceil((resolution_n + 1) / 2.0))
            then cast(first_resolution_calendar_minutes as double) end) as median_resolution_minutes
      from (
        select
          assignee_name,
          first_reply_time_calendar_minutes,
          first_resolution_calendar_minutes,
          row_number() over (
            partition by assignee_name, first_reply_time_calendar_minutes is null
            order by first_reply_time_calendar_minutes) as reply_rn,
          count(first_reply_time_calendar_minutes) over (partition by assignee_name) as reply_n,
          row_number() over (
            partition by assignee_name, first_resolution_calendar_minutes is null
            order by first_resolution_calendar_minutes) as resolution_rn,
          count(first_resolution_calendar_minutes) over (partition by assignee_name) as resolution_n
        from {{ ref('zendesk__ticket_metrics') }}
        where status is distinct from 'deleted' and not coalesce(_fivetran_deleted, false)
          and assignee_name is not null
          and {{ filter_date_range('created_at', date_range) }}
          and {{ filter('assignee_name', assignee) }}
          and {{ filter('group_name', group) }}
      ) ranked
      group by assignee_name

  agent_summary:
    dialect: duckdb
    sql: |
      select
        t.assignee_name,
        count(*) as tickets,
        sum(case when t.status in ('solved', 'closed') then 1 else 0 end) as solved,
        max(agent_medians.median_first_reply_minutes) as median_first_reply_minutes,
        max(agent_medians.median_resolution_minutes) as median_resolution_minutes,
        (sum(case when t.ticket_satisfaction_score = 'good' then 1.0 else 0.0 end)) / nullif(sum(case when t.ticket_satisfaction_score in ('good', 'bad') then 1 else 0 end), 0) as csat_rate,
        (sum(case when t.is_one_touch_resolution then 1.0 else 0.0 end)) / nullif(sum(case when t.status in ('solved', 'closed') then 1 else 0 end), 0) as one_touch_rate,
        avg(cast(t.count_ticket_handoffs as double)) as avg_handoffs
      from {{ ref('zendesk__ticket_metrics') }} t
      left join {{ queries.agent_medians }} on agent_medians.assignee_name = t.assignee_name
      where t.status is distinct from 'deleted' and not coalesce(t._fivetran_deleted, false)
        and t.assignee_name is not null
        and {{ filter_date_range('t.created_at', date_range) }}
        and {{ filter('t.assignee_name', assignee) }}
        and {{ filter('t.group_name', group) }}
      group by 1
      order by tickets desc

  agent_csat:
    dialect: duckdb
    sql: |
      select
        assignee_name,
        (sum(case when ticket_satisfaction_score = 'good' then 1.0 else 0.0 end)) / nullif(sum(case when ticket_satisfaction_score in ('good', 'bad') then 1 else 0 end), 0) as csat_rate,
        sum(case when ticket_satisfaction_score in ('good', 'bad') then 1 else 0 end) as rated_tickets
      from {{ ref('zendesk__ticket_metrics') }}
      where status is distinct from 'deleted' and not coalesce(_fivetran_deleted, false)
          and assignee_name is not null
        and ticket_satisfaction_score in ('good', 'bad')
        and {{ filter_date_range('created_at', date_range) }}
        and {{ filter('assignee_name', assignee) }}
          and {{ filter('group_name', group) }}
      group by 1
      having sum(case when ticket_satisfaction_score in ('good', 'bad') then 1 else 0 end) >= 5
      order by 2 desc

  agent_resolution:
    dialect: duckdb
    sql: |
      select assignee_name, median_resolution_minutes
      from {{ queries.agent_summary }}
      where solved >= 5
      order by median_resolution_minutes desc

charts:
  summary_table:
    title: Agent Summary
    query: agent_summary
    type: table
    style:
      columns:
        assignee_name:
          label: Agent
        tickets:
          format: integer
          align: right
        solved:
          format: integer
          align: right
        median_first_reply_minutes:
          label: Median First Reply (min)
          format: number_full
          align: right
        median_resolution_minutes:
          label: Median Resolution (min)
          format: number_full
          align: right
        csat_rate:
          label: CSAT (%)
          format: percent_whole
          align: right
        one_touch_rate:
          label: One-touch (%)
          format: percent_whole
          align: right
        avg_handoffs:
          label: Avg Handoffs
          format: number_full
          align: right

  workload_chart:
    title: Tickets by Agent
    query: agent_summary
    type: bar
    x: assignee_name
    y: tickets

  resolution_chart:
    title: Median Resolution (min)
    subtitle: Agents with 5+ solved tickets
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    query: agent_resolution
    type: bar
    x: assignee_name
    y: median_resolution_minutes

  csat_chart:
    title: CSAT
    subtitle: Agents with 5+ rated tickets
    warnings_ignore: [WARN-QUERY-RETURNED-ZERO-ROWS]
    query: agent_csat
    type: bar
    x: assignee_name
    y: csat_rate
    y_label: CSAT (%)
    style:
      axis_y:
        labels:
          format: percent_whole

rows:
  - text: |
      [Overview](./overview) · [Backlog](./backlog) · **Agent performance** · [SLA](./sla)
  - summary_table
  - cols: [workload_chart, resolution_chart, csat_chart]
